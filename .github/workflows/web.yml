# Publica la web en GitHub Pages cada vez que cambia algo en main.
# Si hay peticiones «Desde una web» (peticiones/*.json), primero crea esos sistemas (scripts/from_url.mjs).
# Regenera las salidas de todos los sistemas (CSS, Figma, kit), comprueba los tokens y construye la web.
# Si la web guardó tokens nuevos, también sube al repositorio lo regenerado (y «Abrir la web.html»),
# para que la carpeta siempre esté completa. Ese commit no vuelve a lanzar este proceso.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Crear los sistemas pedidos desde una web (peticiones/)
        if: hashFiles('peticiones/*.json') != ''
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/from_url.mjs --requests
      - name: Regenerar los sistemas
        run: python scripts/generate.py --all
      - name: Comprobar que los dos generadores coinciden
        run: python scripts/check_generator.py
      - name: Publicar cada sistema como registro de shadcn (…/r/<sistema>/<componente>.json)
        run: python scripts/build_registry.py web/public/r
      - name: Construir la web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Comprobar que todo sale de tokens
        run: |
          python scripts/check_tokens.py | tee "$RUNNER_TEMP/check.txt"
          ! grep -E ": [1-9]" "$RUNNER_TEMP/check.txt"
      - name: Guardar lo regenerado en el repositorio
        run: |
          cp web/dist/index.html "Abrir la web.html"
          git add -A
          if git diff --cached --quiet; then echo "Nada que guardar"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerar CSS, Figma, kit y web"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
